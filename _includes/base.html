<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ excerpt | default: description | default: site.description | escape }}">
  {%- if author %}
  <meta name="author" content="{{ author | escape }}">
  {%- endif %}
  <title>{% if title %}{{ title | escape }} · {% endif %}{{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400&display=swap">
  <link rel="stylesheet" href="/styles.css">
  {%- if usesThree %}
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
  {%- endif %}
</head>
<body{% if bodyClass %} class="{{ bodyClass }}"{% endif %}>
  <nav class="site-nav" aria-label="Site">
    {%- for item in site.nav %}
    <a href="{{ item.url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.label }}</a>
    {%- endfor %}
  </nav>
  <a href="/" class="logo-link" aria-label="Home"><img class="logo" src="/logo.png" alt="zotter.computer"></a>
  <main>
    {{ content }}
  </main>
</body>
</html>
